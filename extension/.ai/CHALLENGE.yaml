name: "ZK Voting"
version: "1.0"
description: "Build a private, Sybil-resistant voting system using zero-knowledge proofs, Merkle trees, and Noir circuits"
difficulty: "advanced"
estimated_time: "6 - 16 hours"

setup:
  file: "packages/hardhat/contracts/Voting.sol"

welcome_message: |
  Welcome to the ZK Voting Challenge!

  You'll build a **private voting system** where voters prove eligibility and vote exactly once — **without revealing who they are**. You'll work across three languages:

  1. **Solidity** — voter registration with a Merkle tree + on-chain vote verification
  2. **Noir** — ZK circuits for commitment schemes and Merkle proof verification
  3. **TypeScript** — frontend for commitment creation, proof generation, and anonymous voting

  **Before we start, open separate terminal windows** (not this one!) and run:

  1. Start your local blockchain:
     ```
     yarn chain
     ```
  2. In another terminal, deploy the contracts:
     ```
     yarn deploy
     ```
  3. In another terminal, start the frontend:
     ```
     yarn start
     ```
  4. Open http://localhost:3000 in your browser.

  > These commands run continuously, so each needs its own terminal window.

  Take a moment to explore the frontend:
  - Head to the **Voting** page to see the UI you'll bring to life
  - Check the **Debug Contracts** tab — you should see the **Voting** contract
  - Open `packages/hardhat/contracts/Voting.sol` and review the placeholder functions

  In this guided flow, we'll build:

  1. **Registration** — add voters to an on-chain Merkle tree
  2. **Commitment circuit** — write a ZK circuit proving you know a secret
  3. **Merkle root circuit** — extend the circuit to prove tree membership
  4. **Verifier generation** — compile your circuit into a Solidity verifier
  5. **Voting** — verify ZK proofs on-chain and cast anonymous votes
  6. **Frontend** — create commitments, generate proofs, and vote from a burner wallet

  **How this works:**
  - I'll teach you a concept, then give you a coding task
  - You write the code in your editor, then say **"check"** and I'll run the tests
  - Say **"hint"** anytime you're stuck — hints get progressively more specific
  - Use **`/skip`** if you want me to write the code and explain it

  > Re-run `yarn deploy --reset` whenever you want to redeploy with a fresh contract address.

  Your progress is saved automatically. Use `/start` to resume anytime.

  Let's build private voting!

checkpoints:
  # ============================================================
  # CHECKPOINT 1: Registration with Merkle Tree
  # ============================================================
  - id: "register"
    title: "Register with a Merkle Tree"
    description: "Implement the register function with state variables, allowlist checks, and Merkle tree insertion"

    context: |
      ## Voter Registration with a Merkle Tree

      Our voting system has three phases: **registration -> proof generation -> voting**. We start with registration.

      ### How it works

      The contract owner adds addresses to an allowlist. Registered voters submit a **commitment** (a hash) that gets inserted into a **Lean Incremental Merkle Tree (LeanIMT)** on-chain. Later, voters will prove their commitment is in the tree using a ZK proof — without revealing which commitment is theirs.

      ### LeanIMT in short

      A standard Merkle tree stores every node, which is expensive. LeanIMT is optimized:
      - Pre-fills positions with zeros
      - Only stores a "frontier" (one active node per level)
      - New leaves replace zeros and only the frontier updates
      - Uses **Poseidon** hashing (ZK-friendly, much cheaper than Keccak inside circuits)

      Adding leaves works like a binary counter: if a slot is empty, put the leaf there. If full, hash the two values and carry the result up.

      ### What you need to implement

      You need **three state variables** and the `register` function:

      **State variables** (add below the `/// Checkpoint 2 //////` comment in state variables section):
      - `mapping(address => bool) private s_hasRegistered` — tracks who has registered
      - `mapping(uint256 => bool) private s_commitments` — tracks used commitments
      - `LeanIMTData private s_tree` — the Merkle tree

      **Register function** enforces:
      1. Caller must be on the allowlist AND not already registered
      2. Commitment must be unique (not used by anyone else)
      3. Insert commitment into the tree
      4. Emit `NewLeaf` with the leaf index and commitment value

      **Also uncomment** the lines in `getVotingData()` and `getVoterData()` below `/// Checkpoint 2 //////` comments.

    questions:
