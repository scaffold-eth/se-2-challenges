  # CHECKPOINT 6: Create Your Commitment — Frontend
  # ============================================================
  - id: "create-commitment"
    title: "Create Your Commitment — Frontend Integration"
    description: "Implement commitment generation in TypeScript using Poseidon hashing and Fr field elements"

    context: |
      ## From Contract to Frontend

      You've built the smart contract and the ZK circuit. Now let's bring the **Register** button to life!

      Before anyone can vote, they need a **commitment** — a hash of their private nullifier and secret. This is what gets stored in the Merkle tree during registration.

      ### How it works in the frontend

      1. Generate a random **nullifier** and **secret** using `Fr.random()` (BN254 field elements)
      2. Hash them with **Poseidon** to create the **commitment**
      3. Format everything as `bytes32` hex strings for Solidity
      4. The commitment is sent on-chain, while nullifier and secret stay in localStorage

      > `Fr` is the finite field type of BN254, ensuring all numbers stay within the valid scalar field used by ZK circuits.

      > The **commitment** is public (on-chain), but your **nullifier** and **secret** are private — they're the keys to proving your right to vote later. If they leak, someone else could vote on your behalf!

    questions:
      - text: "Why do we use `Fr.random()` instead of `Math.random()` for generating the nullifier and secret?"
        concepts:
          [
            "field",
            "BN254",
            "ZK",
            "range",
            "valid",
            "finite",
            "circuit",
            "compatible",
          ]
        hint: "ZK circuits operate over a specific finite field (BN254). Values must be valid field elements — `Math.random()` could produce values outside this range."

      - text: "Why is the order `[nullifier, secret]` important when computing the Poseidon hash?"
        concepts:
          [
            "order",
            "match",
            "circuit",
            "same",
            "hash",
            "different",
            "commitment",
          ]
        hint: "The circuit hashes `[nullifier, secret]` in that order. If you swap them in the frontend, the commitment won't match what the circuit expects, and proof verification will fail."

    task:
      description: |
        Open `packages/nextjs/app/voting/_challengeComponents/CreateCommitment.tsx`.

        **1. Uncomment the imports** at the top (lines 5-7):
        ```ts
        import { Fr } from "@aztec/bb.js";
        import { toHex } from "viem";
        import { poseidon2 } from "poseidon-lite";
        ```

        **2. Replace the placeholder in `generateCommitment()`** (lines 15-17):

        - Generate random `nullifier` and `secret` using `Fr.random()`, cast to `BigInt`:
          ```ts
          const nullifier = BigInt(Fr.random().toString());
          const secret = BigInt(Fr.random().toString());
          ```
        - Compute commitment with `poseidon2([nullifier, secret])`
        - Convert all three values to hex with `toHex(value, { size: 32 })`
        - Return `{ commitment, nullifier, secret }` as hex strings

        ### Try it out

        1. Open http://localhost:3000 — go to the **Voting** page.
        2. Add your address to the **allowlist** (you're the owner).
        3. Click **Register to vote** — your commitment gets generated and inserted into the Merkle tree.
        4. You should see "Already registered for this vote" after registering.
        5. Scroll to the bottom and click **Log Local Storage** to inspect your saved commitment data.

        > Each time you restart your local chain with `yarn chain`, scroll to the bottom of the Voting page and hit **Clear Local Storage**.

        Say **"check"** when you're ready!
