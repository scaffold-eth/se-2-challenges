    task:
      description: |
        Implement two functions:

        1. **`repayUpTo(uint256 amount)`**:
           - Convert amount to shares with `_getMyUSDToShares(amount)`
           - If shares > user's debt shares, cap at user's actual debt:
             - Set `amountInShares = s_userDebtShares[msg.sender]`
             - Set `amount = getCurrentDebtValue(msg.sender)`
           - Revert with `MyUSD__InsufficientBalance()` if `amount == 0` or user's MyUSD balance < amount
           - Revert with `MyUSD__InsufficientAllowance()` if allowance < amount
           - Subtract shares from `s_userDebtShares[msg.sender]` and `totalDebtShares`
           - Call `i_myUSD.burnFrom(msg.sender, amount)`
           - Emit `DebtSharesBurned(msg.sender, amount, amountInShares)`

        2. **`withdrawCollateral(uint256 amount)`**:
           - Revert with `Engine__InvalidAmount()` if amount is 0
           - Revert with `Engine__InsufficientCollateral()` if user has less collateral
           - Set `s_userCollateral[msg.sender]` to the new value (subtract amount)
           - If user has debt shares > 0, call `_validatePosition(msg.sender)`
           - Transfer ETH with `payable(msg.sender).transfer(amount)`
           - Emit `CollateralWithdrawn(msg.sender, amount, i_oracle.getETHMyUSDPrice())`

        Say **"check"** when you're ready!
      file: "packages/hardhat/contracts/MyUSDEngine.sol"
      test: "yarn test --grep 'Repayment Operations'"
      hints:
        - |
          For `repayUpTo`, the key is handling overpayment:
          ```solidity
          uint256 amountInShares = _getMyUSDToShares(amount);
          if (amountInShares > s_userDebtShares[msg.sender]) {
              amountInShares = s_userDebtShares[msg.sender];
              amount = getCurrentDebtValue(msg.sender);
          }
          ```
        - |
          For `withdrawCollateral`, update state before validating:
          ```solidity
          s_userCollateral[msg.sender] = s_userCollateral[msg.sender] - amount;
          if (s_userDebtShares[msg.sender] > 0) {
              _validatePosition(msg.sender);
          }
          payable(msg.sender).transfer(amount);
          ```
        - |
          Full solutions:
          ```solidity
          function repayUpTo(uint256 amount) public {
              uint256 amountInShares = _getMyUSDToShares(amount);
              if (amountInShares > s_userDebtShares[msg.sender]) {
                  amountInShares = s_userDebtShares[msg.sender];
                  amount = getCurrentDebtValue(msg.sender);
              }
              if (amount == 0 || i_myUSD.balanceOf(msg.sender) < amount) {
                  revert MyUSD__InsufficientBalance();
              }
              if (i_myUSD.allowance(msg.sender, address(this)) < amount) {
                  revert MyUSD__InsufficientAllowance();
              }
              s_userDebtShares[msg.sender] -= amountInShares;
              totalDebtShares -= amountInShares;
              i_myUSD.burnFrom(msg.sender, amount);
              emit DebtSharesBurned(msg.sender, amount, amountInShares);
          }

          function withdrawCollateral(uint256 amount) external {
              if (amount == 0) revert Engine__InvalidAmount();
              if (s_userCollateral[msg.sender] < amount) revert Engine__InsufficientCollateral();
              uint256 newCollateral = s_userCollateral[msg.sender] - amount;
              s_userCollateral[msg.sender] = newCollateral;
              if (s_userDebtShares[msg.sender] > 0) {
                  _validatePosition(msg.sender);
              }
              payable(msg.sender).transfer(amount);
              emit CollateralWithdrawn(msg.sender, amount, i_oracle.getETHMyUSDPrice());
          }
          ```
      solution: |
        function repayUpTo(uint256 amount) public {
            uint256 amountInShares = _getMyUSDToShares(amount);
            if (amountInShares > s_userDebtShares[msg.sender]) {
                amountInShares = s_userDebtShares[msg.sender];
                amount = getCurrentDebtValue(msg.sender);
            }
            if (amount == 0 || i_myUSD.balanceOf(msg.sender) < amount) {
                revert MyUSD__InsufficientBalance();
            }
            if (i_myUSD.allowance(msg.sender, address(this)) < amount) {
                revert MyUSD__InsufficientAllowance();
            }
            s_userDebtShares[msg.sender] -= amountInShares;
            totalDebtShares -= amountInShares;
            i_myUSD.burnFrom(msg.sender, amount);
            emit DebtSharesBurned(msg.sender, amount, amountInShares);
        }

        function withdrawCollateral(uint256 amount) external {
            if (amount == 0) revert Engine__InvalidAmount();
            if (s_userCollateral[msg.sender] < amount) revert Engine__InsufficientCollateral();
            uint256 newCollateral = s_userCollateral[msg.sender] - amount;
            s_userCollateral[msg.sender] = newCollateral;
            if (s_userDebtShares[msg.sender] > 0) {
                _validatePosition(msg.sender);
            }
            payable(msg.sender).transfer(amount);
            emit CollateralWithdrawn(msg.sender, amount, i_oracle.getETHMyUSDPrice());
        }

  # ============================================================
  # CHECKPOINT 4: Liquidation
  # ============================================================
  - id: "liquidation"
    title: "Liquidation - Enforcing System Stability"
    description: "Implement isLiquidatable and liquidate to protect the system from bad debt"
    deployAfterCheckpoint: true

    context: |
      ## Liquidation: The System's Safety Net

      If ETH price drops or debt accrues too much interest, positions can fall below the 150% collateral ratio. **Liquidation** ensures bad debt never accumulates:

      1. Anyone can check if a position is unsafe with `isLiquidatable()`
      2. Anyone can call `liquidate()` on an unsafe position
      3. The liquidator pays off the user's debt and receives their collateral **plus a 10% bonus** (`LIQUIDATOR_REWARD`)

      This creates a market of liquidators who actively monitor the system, act quickly when positions become unsafe, and profit from their service — all while keeping the protocol healthy.

      ### How liquidation works step by step:
      1. Check the position is actually liquidatable
      2. Verify the liquidator has enough MyUSD and has approved spending
      3. Burn the liquidator's MyUSD to cover the debt
      4. Clear the user's debt shares
      5. Calculate collateral to cover debt + 10% reward
      6. Cap at the user's total collateral (can't give away more than exists)
      7. Transfer collateral to the liquidator

      **Important:** The liquidated user still keeps the MyUSD they originally minted. The liquidator used their own MyUSD to pay off the debt.

    questions:
      - text: "After a liquidation, the original borrower still has the MyUSD they minted. Who actually 'paid' for the debt to be cleared?"
        concepts:
          [
            "liquidator",
            "their own",
            "burn",
            "collateral",
            "reward",
            "incentiv",
          ]
        hint: "The liquidator burned their own MyUSD to clear the debt. In return, they got the borrower's ETH collateral plus a bonus. The original borrower keeps their MyUSD but loses their collateral."

    task:
      description: |
        Implement two functions:

        1. **`isLiquidatable(address user)`**:
           - Get the position ratio with `calculatePositionRatio(user)`
           - Return `true` if `(positionRatio * 100) < COLLATERAL_RATIO * PRECISION`

        2. **`liquidate(address user)`**:
           - Revert with `Engine__NotLiquidatable()` if user is not liquidatable
           - Get the user's debt value, collateral amount, and collateral value
           - Revert with `MyUSD__InsufficientBalance()` if liquidator's MyUSD balance < debt
           - Revert with `MyUSD__InsufficientAllowance()` if allowance < debt
           - Burn debt amount from liquidator: `i_myUSD.burnFrom(msg.sender, userDebtValue)`
           - Clear user's debt: subtract their shares from `totalDebtShares`, set their shares to 0
           - Calculate collateral for liquidator:
             - `collateralToCoverDebt = (userDebtValue * userCollateral) / collateralValue`
             - `rewardAmount = (collateralToCoverDebt * LIQUIDATOR_REWARD) / 100`
             - `amountForLiquidator = collateralToCoverDebt + rewardAmount`
             - Cap: if `amountForLiquidator > userCollateral`, set to `userCollateral`
           - Update user's collateral: `s_userCollateral[user] = userCollateral - amountForLiquidator`
           - Transfer ETH: `(bool sent, ) = payable(msg.sender).call{value: amountForLiquidator}("")`
           - Revert with `Engine__TransferFailed()` if not sent
           - Emit `Liquidation(user, msg.sender, amountForLiquidator, userDebtValue, i_oracle.getETHMyUSDPrice())`

        Say **"check"** when you're ready!
      file: "packages/hardhat/contracts/MyUSDEngine.sol"
      test: "yarn test --grep 'Liquidation'"
