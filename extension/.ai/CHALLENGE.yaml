          ```
          Also uncomment the lines in `getVotingData()` and `getVoterData()`.

          For the deploy script: set your frontend address as `ownerAddress`, uncomment the `PoseidonT3` and `LeanIMT` deployments, and replace the placeholder `leanIMTAddress` with `leanIMT.address`.
      solution: |
        // State variables:
        mapping(address => bool) private s_hasRegistered;
        mapping(uint256 => bool) private s_commitments;
        LeanIMTData private s_tree;

        // Register function:
        function register(uint256 _commitment) public {
            if (!s_voters[msg.sender] || s_hasRegistered[msg.sender]) {
                revert Voting__NotAllowedToVote();
            }
            if (s_commitments[_commitment]) {
                revert Voting__CommitmentAlreadyAdded(_commitment);
            }
            s_commitments[_commitment] = true;
            s_hasRegistered[msg.sender] = true;
            s_tree.insert(_commitment);
            emit NewLeaf(s_tree.size - 1, _commitment);
        }

        // Uncomment in getVotingData():
        size = s_tree.size;
        depth = s_tree.depth;
        root = s_tree.root();

        // Uncomment in getVoterData():
        registered = s_hasRegistered[_voter];

  # ============================================================
  # CHECKPOINT 2: ZK Circuit — Commitment Scheme
  # ============================================================
  - id: "commitment-circuit"
    title: "Write Your First ZK Circuit — Commitment Scheme"
    description: "Write a Noir circuit that proves knowledge of a nullifier and secret without revealing them"

    context: |
      ## Your First ZK Circuit

      Now we switch to **Noir**, a language for writing ZK circuits. The goal: let a voter **prove they know a secret** without revealing it.

      ### What's a ZK circuit?

      A circuit is a set of mathematical constraints. Noir lets you write these as a program, which compiles into math that a proving system (Barretenberg) turns into cryptographic proofs.

      - **Public inputs** (marked `pub`) are visible to the verifier/on-chain
      - **Private inputs** (witnesses) stay hidden — they never leave the prover's machine

      ### Commitment Scheme

      We combine two private values:
      - **nullifier** — will be hashed and tracked on-chain to prevent double-voting
      - **secret** — combined with nullifier to form the commitment

      `commitment = hash(nullifier, secret)` — this is what was stored in the Merkle tree during registration.

      ### What you'll implement

      Inside the circuit's `main` function (at `////// Checkpoint 3 //////`):

      1. **Recompute the nullifier hash**: Hash the private `nullifier` with `hash_1` and assert it equals the public `nullifier_hash`
      2. **Build the commitment**: Hash `nullifier` and `secret` together with `hash_2`

      The `assert` ensures the prover really knows the nullifier (not just guessing). The commitment will be used in the next checkpoint to prove Merkle tree membership.

      ### Poseidon hashing

      We use Poseidon (already imported as `hash_1` and `hash_2`) instead of SHA256/Keccak because it's dramatically cheaper inside ZK circuits.

