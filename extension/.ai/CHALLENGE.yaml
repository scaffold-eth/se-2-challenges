  - id: "generate-proof"
    title: "Generate Your ZK Proof"
    description: "Implement proof generation using Noir.js and UltraHonk in the frontend"

    context: |
      ## Creating the ZK Proof

      You've registered and have your commitment in the Merkle tree. Now comes the magic: generating a **zero-knowledge proof** that says "I'm registered and I want to vote" — without revealing who you are.

      ### Two proofs in one step

      1. **Merkle inclusion proof** — rebuild the tree from events, then call `generateProof()` on it to get the siblings (path from your leaf to the root)
      2. **ZK proof** — feed the siblings + your private inputs into the Noir circuit, then use UltraHonk to produce the cryptographic proof

      ### The flow

      1. Compute `nullifierHash` from your nullifier using `poseidon1`
      2. Rebuild the LeanIMT from on-chain events (using `@zk-kit/lean-imt`)
      3. Generate Merkle proof to get siblings, pad to 16
      4. Prepare circuit inputs (must match circuit parameter order exactly)
      5. Create witness with `Noir` and generate proof with `UltraHonkBackend`

      > The **UltraHonk backend** takes your circuit's bytecode + witness to generate the proof. It produces the same format your Solidity verifier expects.

    questions:
      - text: "Why do we rebuild the Merkle tree from events in the frontend instead of reading it directly from the contract?"
        concepts:
          [
            "siblings",
            "path",
            "nodes",
            "not stored",
            "events",
            "reconstruct",
            "tree",
          ]
        hint: "The contract only stores the frontier (a compact summary). To get the full sibling path needed for the proof, we must reconstruct the entire tree from the leaf insertion events."

      - text: "Why must the circuit inputs be in the exact same order as declared in the Noir `main` function?"
        concepts:
          [
            "order",
            "position",
            "match",
            "witness",
            "constraint",
            "fail",
            "parameter",
          ]
        hint: "The circuit maps inputs by position, not by name. If the order doesn't match, the wrong values go into the wrong constraints and the proof will fail."

    task:
      description: |
        Open `packages/nextjs/app/voting/_challengeComponents/GenerateProof.tsx`.

        **1. Uncomment the imports** at the top (lines 5-10):
        ```ts
        import { UltraHonkBackend } from "@aztec/bb.js";
        // @ts-ignore
        import { Noir } from "@noir-lang/noir_js";
        import { LeanIMT } from "@zk-kit/lean-imt";
        import { encodeAbiParameters, toHex } from "viem";
        import { poseidon1, poseidon2 } from "poseidon-lite";
        ```

        **2. Replace the placeholder in `generateProof()`** (remove lines 29-33 with the `void` and dummy return):

        a. **Compute nullifier hash:**
           ```ts
           const nullifierHash = poseidon1([BigInt(_nullifier)]);
           ```

        b. **Rebuild Merkle tree from events:**
           ```ts
           const calculatedTree = new LeanIMT((a: bigint, b: bigint) => poseidon2([a, b]));
           const leaves = _leaves.map(event => event?.args.value);
           const leavesReversed = leaves.reverse();
           calculatedTree.insertMany(leavesReversed as bigint[]);
           ```

        c. **Generate Merkle proof and pad siblings to 16:**
           ```ts
           const calculatedProof = calculatedTree.generateProof(_index);
           const sibs = calculatedProof.siblings.map(sib => sib.toString());
           const lengthDiff = 16 - sibs.length;
           for (let i = 0; i < lengthDiff; i++) { sibs.push("0"); }
           ```

        d. **Prepare circuit inputs** (must match circuit parameter order):
           ```ts
           const input = {
             nullifier_hash: nullifierHash.toString(),
             nullifier: BigInt(_nullifier).toString(),
             secret: BigInt(_secret).toString(),
             root: _root.toString(),
             vote: _vote,
             depth: _depth.toString(),
             index: _index.toString(),
             siblings: sibs,
           };
           ```

        e. **Create witness and generate proof:**
           ```ts
           const noir = new Noir(_circuitData);
           const { witness } = await noir.execute(input);
           const honk = new UltraHonkBackend(_circuitData.bytecode, { threads: 1 });
           const { proof, publicInputs } = await honk.generateProof(witness, { keccak: true });
           return { proof, publicInputs };
           ```

