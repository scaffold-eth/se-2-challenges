completion_message: |
  Congratulations! You've built a complete **private, Sybil-resistant voting system**!

  You implemented the full stack:
  - **Voter registration** with a Lean Incremental Merkle Tree
  - **A ZK commitment circuit** proving knowledge of a nullifier and secret
  - **Merkle proof verification** in a Noir circuit
  - **Solidity verifier generation** from your circuit via Barretenberg
  - **On-chain vote verification** with proof checking, nullifier tracking, and vote counting
  - **Frontend commitment creation** with Poseidon hashing
  - **ZK proof generation** using Noir.js and UltraHonk
  - **Anonymous voting** via burner wallets

  Your system ensures:
  - Voters prove eligibility via ZK proofs (no identity revealed)
  - Double-voting is prevented via nullifier hashes
  - Results are transparently tracked on-chain
  - No one can link a vote to the voter who cast it

