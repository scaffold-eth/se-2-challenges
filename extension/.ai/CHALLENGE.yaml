  - id: "burner-wallet-vote"
    title: "Vote with a Burner Wallet"
    description: "Create a burner wallet and submit your anonymous vote on-chain"

    context: |
      ## Breaking the Link: Anonymous Voting

      You have your ZK proof — now it's time to actually **cast your vote**.

      But here's the catch: if you use the **same address** you registered with, everyone can see on-chain which address voted and how. That would undo all the ZK privacy!

      ### The solution: burner wallets

      Send the vote from a **fresh, never-used address** with no connection to your registration. Only the proof ties you to the tree — and the proof reveals nothing about your identity.

      ### Two functions to implement

      1. **`generateBurnerWallet()`** — create a new wallet with `generatePrivateKey()` and `privateKeyToAccount()` from viem
      2. **`sendVoteWithBurner()`** — fund the burner (Hardhat only), then call the `vote` function with your proof and public inputs

      > On a local Hardhat network, we fund the burner using `setBalance`. On testnets, you'd use ERC-4337 Account Abstraction with a paymaster to cover gas — that's covered in the README's remaining checkpoints.

    questions:
